apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: msg-namespace
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: martinanajdovska/unsent-message-project-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
