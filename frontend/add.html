<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <form id="message-form" method="post">
        <div class="form-group">
            <label for="text">Message</label>
            <textarea class="form-control" rows="3" id="text" name="text" required></textarea>
        </div>
        <div class="form-group mt-2">
            <label for="receiver">To:</label>
            <input type="text" class="form-control" id="receiver" name="receiver" required>
        </div>
        <button id="submit" type="submit" class="btn btn-primary mt-4">Submit</button>
        <a type="button" class="btn btn-primary mt-4" href="index.html">Back</a>
    </form>
</div>
<script src="app.js"></script>
</body>
</html>
